<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ハープとティンパニの試奏台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: one working column on a phone; inputs left and results right on wide screens.
   The score figure and range bars are the visual anchors; chord roles carry the colour. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --sunk: #E9EDF2; --ink: #1A2233; --muted: #566178; --line: #D3DAE3; --line-strong: #A9B3C2;
  --accent: #27468A; --accent-ink: #FFFFFF; --accent-soft: #E3EAF8;
  --r-root: #1A2233; --r-third: #C2432A; --r-fifth: #178070; --r-seventh: #7648B0; --r-tension: #A96F0C;
  --ok: #178070; --care: #A96F0C; --hard: #C2432A; --out: #8A1B2C;
  --ok-soft: #E0F1ED; --care-soft: #F7ECD6; --hard-soft: #F8E2DB; --out-soft: #F3D9DD;
  --q0: #7CC3B4; --q1: #C9D58A; --q2: #EBC27A; --q3: #E59A8A;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131B; --surface: #171D28; --sunk: #1E2532; --ink: #E6E9F0; --muted: #98A3B7; --line: #2A3343; --line-strong: #455064;
    --accent: #8DAEF2; --accent-ink: #0F131B; --accent-soft: #1E2A44;
    --r-root: #E6E9F0; --r-third: #FF8C6E; --r-fifth: #54CFB5; --r-seventh: #BCA0F5; --r-tension: #EFBE55;
    --ok: #54CFB5; --care: #EFBE55; --hard: #FF8C6E; --out: #FF6F86;
    --ok-soft: #14302B; --care-soft: #33290F; --hard-soft: #3A1D16; --out-soft: #3B1620;
    --q0: #2F7C6E; --q1: #6F7A35; --q2: #8E6A22; --q3: #8E4436;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131B; --surface: #171D28; --sunk: #1E2532; --ink: #E6E9F0; --muted: #98A3B7; --line: #2A3343; --line-strong: #455064;
  --accent: #8DAEF2; --accent-ink: #0F131B; --accent-soft: #1E2A44;
  --r-root: #E6E9F0; --r-third: #FF8C6E; --r-fifth: #54CFB5; --r-seventh: #BCA0F5; --r-tension: #EFBE55;
  --ok: #54CFB5; --care: #EFBE55; --hard: #FF8C6E; --out: #FF6F86;
  --ok-soft: #14302B; --care-soft: #33290F; --hard-soft: #3A1D16; --out-soft: #3B1620;
  --q0: #2F7C6E; --q1: #6F7A35; --q2: #8E6A22; --q3: #8E4436;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.35; }
p { margin: 0; }
ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 20px; padding-block: 10px 0; }
.top h1 { font-size: 19px; letter-spacing: 0.04em; padding-bottom: 8px; }
.tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font: 500 14px/1.2 var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px 9px; white-space: nowrap; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

main { padding-block: 20px 56px; }
.lead { display: grid; gap: 4px; margin-bottom: 16px; max-width: 42em; }
.lead h2 { font-size: 24px; }
.lead p { color: var(--muted); }
.cols { display: grid; gap: 16px; }
.col-in, .col-out { display: grid; gap: 16px; min-width: 0; align-content: start; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); align-items: start; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
section.card + section.card, #p-score > section, #p-rules > section, #p-inst > section { margin-top: 16px; }
.cols section.card + section.card { margin-top: 0; }
.card h3 { font-size: 17px; }
.card h4 { font-size: 14.5px; margin-top: 6px; }
.sub, .cap { color: var(--muted); font-size: 13px; line-height: 1.55; }
.cap { font-size: 12px; }
.note { font-size: 13.5px; background: var(--sunk); border-radius: 8px; padding: 8px 12px; }
.empty { color: var(--muted); padding: 12px 0; }

.f { display: grid; gap: 5px; min-width: 0; }
.f > span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.f small { font-weight: 400; margin-left: 6px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
.inline { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; }
input[type="text"], input[type="number"], select { font: 500 16px/1.3 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input[type="number"] { max-width: 7em; font-variant-numeric: tabular-nums; }
.notepick { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 4px; }
.notepick select { padding-inline: 6px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13.5px/1.2 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip .cnt { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.pg { border-radius: 8px; font-size: 15px; font-weight: 700; padding: 8px 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ok); }
.dot.lv-care { background: var(--care); } .dot.lv-hard { background: var(--hard); } .dot.lv-out { background: var(--out); }
.chip[aria-pressed="true"] .dot { outline: 1.5px solid var(--accent-ink); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 500 14px/1.2 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.quiet { border-color: transparent; color: var(--muted); text-decoration: underline; padding-inline: 4px; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 16px; }

details > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "＋"; color: var(--muted); font-weight: 700; width: 1em; }
details[open] > summary::before { content: "－"; }
details.line { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
details.line[open] { display: grid; gap: 12px; }
.ln-name { font-weight: 700; }
.ln-sum { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; letter-spacing: 0.08em; }
details.more > summary, details.help > summary { color: var(--accent); font-weight: 500; font-size: 14px; }
details.more[open], details.help[open] { display: grid; gap: 10px; }
details.help p { font-size: 13.5px; font-variant-numeric: tabular-nums; }
details.fold > summary h3 { display: inline; }
.tg-row { display: grid; grid-template-columns: 2.6em 1fr; gap: 8px; align-items: start; }
.tg-fam { font-size: 12.5px; font-weight: 700; color: var(--muted); padding-top: 7px; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1px 7px; background: var(--ok-soft); white-space: nowrap; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.badge.lv-care { background: var(--care-soft); } .badge.lv-care i { background: var(--care); border-radius: 1px; transform: rotate(45deg); }
.badge.lv-hard { background: var(--hard-soft); } .badge.lv-hard i { background: var(--hard); border-radius: 1px; }
.badge.lv-out { background: var(--out-soft); } .badge.lv-out i { background: var(--out); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.badge.lv-idea { background: var(--accent-soft); } .badge.lv-idea i { background: var(--accent); }

.plan-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.sum { font-weight: 500; }
.mrow { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; min-width: 0; }
.mrow header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.mrow .from { font-weight: 700; }
.mrow .arrow { color: var(--muted); }
.mrow .to { font: 700 17px/1.3 var(--f-display); }
.mrow .to.none { color: var(--out); }
.fit { display: grid; gap: 2px; }
.issues { display: grid; gap: 6px; font-size: 14px; }
.issues li { padding-left: 14px; position: relative; }
.issues li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 7px; height: 7px; background: var(--care); border-radius: 1px; transform: rotate(45deg); }
.issues li.lv-hard::before { background: var(--hard); transform: none; }
.issues li.lv-out::before { background: var(--out); transform: none; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.ihow { display: block; color: var(--muted); font-size: 13.5px; padding-left: 1.1em; position: relative; }
.ihow::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
.write { font-size: 14px; }
.write b { font-size: 12px; color: var(--muted); margin-right: 8px; }
.hints { display: grid; gap: 12px; }
.hint { display: grid; gap: 4px; border-top: 1px dashed var(--line); padding-top: 10px; }
.hint .hh { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.hint .mm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint p { font-size: 14px; }
.how { display: grid; gap: 3px; font-size: 14px; }
.how li { padding-left: 1.1em; position: relative; }
.how li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
.okline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.pat { display: grid; gap: 4px; }
.pat dt { font-weight: 700; margin-top: 8px; }
.pat dt:first-child { margin-top: 0; }
.pat dd { font-size: 14px; color: var(--muted); }

.prog { display: flex; flex-wrap: wrap; gap: 6px; }
.chord-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.chord-head .sym { font: 700 34px/1.1 var(--f-display); letter-spacing: 0.01em; }
.tones { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13.5px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--r-root); }
.sw.r3, .bar i.r3 { background: var(--r-third); } .sw.r5, .bar i.r5 { background: var(--r-fifth); } .sw.r7, .bar i.r7 { background: var(--r-seventh); } .sw.rT, .bar i.rT { background: var(--r-tension); } .bar i.rR { background: var(--r-root); }
.scroll-x { overflow-x: auto; max-width: 100%; }
.fig { background: var(--sunk); border-radius: 10px; padding: 6px 8px; }
.why { display: grid; gap: 5px; font-size: 14px; }
.why li { padding-left: 1em; position: relative; }
.why li::before { content: "・"; position: absolute; left: 0; color: var(--muted); }
.bal { display: grid; gap: 6px; max-width: 460px; }
.bal-row { display: grid; grid-template-columns: 5.2em 1fr 3em; gap: 8px; align-items: center; font-size: 13.5px; }
.bar { position: relative; height: 10px; background: var(--sunk); border-radius: 5px; display: block; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.bv { font-variant-numeric: tabular-nums; text-align: right; }
.vt { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.vt th { text-align: left; font: 500 12px var(--f-body); color: var(--muted); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.vt td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.vt td:first-child { font-weight: 700; white-space: nowrap; }
.vt .n { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
.vt small { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; }
.vt small.lv-hard { color: var(--hard); }
.vt tr.rest td { color: var(--muted); font-weight: 400; }
.fallback { width: 100%; font: 12px/1.5 ui-monospace, monospace; color: var(--ink); background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; }
.ens { display: grid; gap: 10px; }
.ens-fam { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.step { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; }
.step .nm { min-width: 2.6em; font-weight: 700; } .step .nm.off { color: var(--muted); font-weight: 400; }
.step b { min-width: 1em; text-align: center; font-variant-numeric: tabular-nums; }
.step button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1; cursor: pointer; }
.step button[disabled] { opacity: 0.35; cursor: default; }

.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: grid; text-align: left; min-width: 54px; padding: 4px 9px 5px; border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; font-family: var(--f-body); }
.seg small { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg b { font-size: 14.5px; }
.seg.c-low { border-style: dashed; } .seg.c-none b { color: var(--muted); }
.seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.segd { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.snd { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13.5px; }
.snd dt { color: var(--muted); } .snd dd { font-variant-numeric: tabular-nums; }
.lcard { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; min-width: 0; }
.lcard header { display: grid; gap: 2px; }
.lcard header b { font: 700 16px/1.3 var(--f-display); }
.stats { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.famh { font-size: 19px; margin: 26px 0 10px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.icard header { display: flex; align-items: baseline; gap: 10px; }
.icard h4 { font-size: 17px; margin: 0; }
.icard .ab { color: var(--muted); font-size: 13px; font-weight: 700; }
.icard .tr { font-size: 13px; color: var(--muted); }
.regs { display: grid; gap: 5px; font-size: 13.5px; }
.regs li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 0 8px; }
.regs i { width: 10px; height: 10px; border-radius: 2px; margin-top: 0.42em; }
.regs .rr { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.regs b { margin-right: 8px; }
.tips { display: grid; gap: 4px; font-size: 13.5px; }
.tips li { padding-left: 1em; position: relative; }
.tips li::before { content: "・"; position: absolute; left: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.safe { height: 2px; vertical-align: 3px; background: var(--ink); }
i.q0 { background: var(--q0); } i.q1 { background: var(--q1); } i.q2 { background: var(--q2); } i.q3 { background: var(--q3); }
.mapwrap { display: grid; gap: 4px; }

svg text { font-family: var(--f-body); }
.staff { display: block; }
.staff .sl { stroke: var(--line-strong); stroke-width: 1; } .staff .bar { stroke: var(--line-strong); stroke-width: 1; }
.staff .lg { stroke: var(--ink); stroke-width: 1.1; } .staff .ld { stroke: var(--line-strong); stroke-width: 0.8; }
.staff .ink { fill: var(--ink); }
.staff .ct { font-size: 11px; font-weight: 700; fill: var(--muted); }
.staff .lb { font-size: 10.5px; font-weight: 500; fill: var(--ink); }
.nh.rR { fill: var(--r-root); } .nh.r3 { fill: var(--r-third); } .nh.r5 { fill: var(--r-fifth); } .nh.r7 { fill: var(--r-seventh); } .nh.rT { fill: var(--r-tension); }
.nh.ring { stroke: var(--surface); stroke-width: 1.4; }
.rmap, .ibar, .fbar { display: block; width: 100%; height: auto; max-width: 600px; }
.gr { stroke: var(--line); stroke-width: 1; }
.gl { font-size: 8.5px; font-weight: 500; fill: var(--muted); font-variant-numeric: tabular-nums; }
.rl { font-size: 9.5px; font-weight: 700; fill: var(--ink); } .rl.dim { fill: var(--muted); font-weight: 400; }
.rf { stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.rs { fill: var(--line-strong); }
rect.q0 { fill: var(--q0); } rect.q1 { fill: var(--q1); } rect.q2 { fill: var(--q2); } rect.q3 { fill: var(--q3); }
line.safe { stroke: var(--ink); stroke-width: 1.6; }
.ln { fill: var(--ok); } .ln.lv-care { fill: var(--care); } .ln.lv-hard { fill: var(--hard); } .ln.lv-out { fill: var(--out); }
.ln.ghost { fill: none; stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 2; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); font-size: 14px; padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: min(92vw, 520px); z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
/* instrument surfaces: strings in their real colours (C red, F black), wood for neck and soundboard */
:root { --str: #8A93A3; --str-c: #C2432A; --str-f: #1A2233; --wood: #B08A5A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --str: #7C879B; --str-c: #FF8C6E; --str-f: #7FA0F0; --wood: #8A6A45; } }
:root[data-theme="dark"] { --str: #7C879B; --str-c: #FF8C6E; --str-f: #7FA0F0; --wood: #8A6A45; }
textarea { font: 500 16px/1.5 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; resize: vertical; }
.pedals { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.pgrp { display: grid; gap: 4px; }
.foot { font-size: 12px; font-weight: 700; color: var(--muted); }
.prow { display: flex; gap: 6px; }
.pcol { display: grid; gap: 3px; justify-items: center; }
.pcol b { font: 700 16px/1.2 var(--f-display); }

<body>
<div style="background:var(--surface,#fff);border-bottom:1px solid var(--line,#D3DAE3);">
  <div style="max-width:1080px;margin:0 auto;padding:9px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between;">

    <span style="color:var(--muted,#566178);font-size:13px;">試奏台：まこりん作</span>
  </div>
</div>
<header class="top">
  <div class="wrap topin">
    <h1>ハープとティンパニの試奏台</h1>
    <nav class="tabs" role="tablist" aria-label="画面の切り替え">

      <button type="button" role="tab" id="tab-gliss" data-tab="gliss" aria-controls="p-gliss" aria-selected="false">グリッサンド</button>

  <div id="p-harp" role="tabpanel" aria-labelledby="tab-harp"></div>
  <div id="p-gliss" role="tabpanel" aria-labelledby="tab-gliss" hidden></div>
  <div id="p-check" role="tabpanel" aria-labelledby="tab-check" hidden></div>
  <div id="p-timp" role="tabpanel" aria-labelledby="tab-timp" hidden></div>
  <p class="cap foot-note">音域やペダルの決まりは、管弦楽法の本で一般的に教えられている内容を、作り手（AI）の知識から書いたものです。本そのものとは照らし合わせていません。時間の目安は、奏者や楽器で変わります。</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* 管弦楽法ナビ — core: pitch spelling, chord symbols, chord identification */
(function () {
  'use strict';
  const O = (globalThis.Orch = globalThis.Orch || {});

  const LET = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const LPC = [0, 2, 4, 5, 7, 9, 11];
  const FLAT_SP = [[0, 0], [1, -1], [1, 0], [2, -1], [2, 0], [3, 0], [3, 1], [4, 0], [5, -1], [5, 0], [6, -1], [6, 0]];
  const SHARP_SP = [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [3, 0], [3, 1], [4, 0], [4, 1], [5, 0], [5, 1], [6, 0]];
  const ACC = { '-2': '♭♭', '-1': '♭', '0': '', '1': '♯', '2': '♯♯' };

  function mod(n, m) { return ((n % m) + m) % m; }
  function accVal(s) { return s === '#' ? 1 : s === '##' ? 2 : s === 'b' ? -1 : s === 'bb' ? -2 : 0; }
  function spPc(sp) { return mod(LPC[sp.l] + sp.a, 12); }
  function spellPc(pc, pref) { const t = (pref === 'sharp' ? SHARP_SP : FLAT_SP)[mod(pc, 12)]; return { l: t[0], a: t[1] }; }
  function spMidi(sp) { return 12 * (sp.o + 1) + LPC[sp.l] + sp.a; }
  function midiToSp(midi, pcsp) {
    const base = LPC[pcsp.l] + pcsp.a;
    return { l: pcsp.l, a: pcsp.a, o: Math.round((midi - base) / 12) - 1 };
  }
  function midiDefaultSp(midi, pref) { return midiToSp(midi, spellPc(mod(midi, 12), pref)); }
  function parseNote(name) {
    const m = /^([A-Ga-g])(##|bb|#|b|♯|♭)?(-?\d)$/.exec(String(name).trim());
    if (!m) return null;
    const acc = m[2] === '♯' ? '#' : m[2] === '♭' ? 'b' : m[2];
    return spMidi({ l: LET.indexOf(m[1].toUpperCase()), a: accVal(acc), o: +m[3] });
  }
  function N(name) { const v = parseNote(name); if (v == null) throw new Error('bad note ' + name); return v; }

  function deName(l, a) {
    const b = ['C', 'D', 'E', 'F', 'G', 'A', 'H'][l];
    if (a === 0) return b;
    if (a > 0) return b + (a === 1 ? 'is' : 'isis');
    if (l === 2) return a === -1 ? 'Es' : 'Eses';
    if (l === 5) return a === -1 ? 'As' : 'Asas';
    if (l === 6) return a === -1 ? 'B' : 'Heses';
    return b + (a === -1 ? 'es' : 'eses');
  }
  function fmtPc(sp, cfg) { return cfg && cfg.names === 'de' ? deName(sp.l, sp.a) : LET[sp.l] + ACC[sp.a]; }
  function fmtNote(sp, cfg) { return fmtPc(sp, cfg) + (cfg && cfg.oct === 'yamaha' ? sp.o - 1 : sp.o); }
  function fmtMidi(midi, cfg, pref) { return fmtNote(midiDefaultSp(midi, pref), cfg); }

  /* written = sounding moved by (steps letters, semi semitones) */
  function transposeSp(sp, steps, semi) {
    if (!steps && !semi) return { l: sp.l, a: sp.a, o: sp.o };
    let L = sp.l + steps;
    const o = sp.o + Math.floor(L / 7);
    L = mod(L, 7);
    const target = spMidi(sp) + semi;
    const a = target - (12 * (o + 1) + LPC[L]);
    if (Math.abs(a) > 1) return midiToSp(target, spellPc(mod(target, 12), a > 0 ? 'sharp' : 'flat'));
    return { l: L, a: a, o: o };
  }

  const IV_NAMES = ['同じ音', '短2度', '長2度', '短3度', '長3度', '完全4度', '増4度', '完全5度', '短6度', '長6度', '短7度', '長7度', 'オクターブ'];
  function ivName(g) {
    if (g <= 12) return IV_NAMES[g];
    if (g === 24) return '2オクターブ';
    const wide = { 13: '短9度', 14: '長9度', 15: '短10度', 16: '長10度', 17: '完全11度', 18: '増11度', 19: '完全12度', 20: '短13度', 21: '長13度' };
    if (wide[g]) return wide[g];
    const o = Math.floor(g / 12), r = g % 12;
    return o + 'オクターブ' + (r ? '＋' + IV_NAMES[r] : '');
  }

  /* ---------- chord symbols ---------- */
  const ROLE_JA = { R: '根音', '3': '第3音', S: '係留音', '5': '第5音', '6': '第6音', '7': '第7音', T: 'テンション', B: 'バス音' };

  function parseChord(input) {
    const raw = String(input == null ? '' : input).trim();
    if (!raw) return { error: '和音が空です' };
    const s = raw.normalize('NFKC').replace(/♭/g, 'b').replace(/♯/g, '#').replace(/[△Δ]/g, 'maj')
      .replace(/ø/g, 'm7b5').replace(/[°º]/g, 'dim').replace(/[()\[\],\s]/g, '').replace(/[−–]/g, '-');
    const m = /^([A-Ga-g])(##|bb|#|b)?/.exec(s);
    if (!m) return { error: '「' + raw + '」：最初の音名（A〜G）が読めません' };
    const root = { l: LET.indexOf(m[1].toUpperCase()), a: accVal(m[2]) };
    let rest = s.slice(m[0].length);
    let bass = null;
    const sl = /\/([A-Ga-g])(##|bb|#|b)?$/.exec(rest);
    if (sl) { bass = { l: LET.indexOf(sl[1].toUpperCase()), a: accVal(sl[2]) }; rest = rest.slice(0, sl.index); }

    let minor = false, fifth = 7, seventh = null, sixth = false, sus = 0, omit3 = false, omit5 = false, majFlag = false, dim = false;
    const tens = {}; let implied9 = false;
    let i = 0;
    while (i < rest.length) {
      const r = rest.slice(i); let t;
      if ((t = /^(mM7|mmaj7|mMaj7|minmaj7|minMaj7)/.exec(r))) { minor = true; seventh = 11; }
      else if ((t = /^(maj|Maj|MAJ|M)(?=7|9|11|13|$)/.exec(r))) { majFlag = true; }
      else if ((t = /^(maj|Maj|MAJ)/.exec(r))) { majFlag = true; }
      else if ((t = /^(min|mi|m)/.exec(r))) { minor = true; }
      else if (i === 0 && (t = /^-(?!5)/.exec(r))) { minor = true; }
      else if ((t = /^dim7/.exec(r))) { minor = true; dim = true; fifth = 6; seventh = 9; }
      else if ((t = /^dim/.exec(r))) { minor = true; dim = true; fifth = 6; }
      else if ((t = /^aug/.exec(r))) { fifth = 8; }
      else if (i === 0 && (t = /^\+5?(?!9|11)/.exec(r))) { fifth = 8; }
      else if ((t = /^sus(2|4)?/.exec(r))) { sus = t[1] === '2' ? 2 : 4; }
      else if ((t = /^add(13|11|9|6|4|2)/.exec(r))) {
        const n = +t[1];
        if (n === 2 || n === 9) tens[9] = 2; else if (n === 4 || n === 11) tens[11] = 5; else sixth = true;
      }
      else if ((t = /^(omit|no)(3|5)/.exec(r))) { if (t[2] === '3') omit3 = true; else omit5 = true; }
      else if ((t = /^(b|-)(13|9|5)/.exec(r))) { const n = +t[2]; if (n === 5) fifth = 6; else if (n === 9) tens[9] = 1; else tens[13] = 8; }
      else if ((t = /^(#|\+)(11|9|5)/.exec(r))) { const n = +t[2]; if (n === 5) fifth = 8; else if (n === 9) tens[9] = 3; else tens[11] = 6; }
      else if ((t = /^(6\/9|69)/.exec(r))) { sixth = true; tens[9] = 2; }
      else if ((t = /^(13|11|9|7|6)/.exec(r))) {
        const n = +t[1];
        if (n === 6) sixth = true;
        if (n >= 7 && seventh == null) seventh = majFlag ? 11 : 10;
        if (n >= 9 && !(9 in tens)) { tens[9] = 2; implied9 = n > 9; }
        if (n === 11) tens[11] = 5;
        if (n === 13) tens[13] = 9;
      }
      else if ((t = /^5$/.exec(r))) { omit3 = true; }
      else if ((t = /^alt/.exec(r))) { if (seventh == null) seventh = 10; tens[9] = 1; tens[13] = 8; }
      else return { error: '「' + raw + '」：「' + rest.slice(i) + '」の部分が読めません' };
      i += t[0].length;
    }

    const rootPc = spPc(root);
    const tones = [];
    function push(role, semis, letterOff, label, need, opt) {
      const pc = mod(rootPc + semis, 12);
      if (tones.some(function (x) { return x.pc === pc; })) return;
      const L = mod(root.l + letterOff, 7);
      let a = mod(pc - LPC[L] + 6, 12) - 6;
      let sp = { l: L, a: a };
      if (Math.abs(a) > 1) sp = spellPc(pc, a > 0 ? 'sharp' : 'flat');
      tones.push({ role: role, semis: semis, pc: pc, sp: sp, label: label, need: need, opt: !!opt });
    }
    push('R', 0, 0, '根音', 40);
    if (!omit3) {
      if (sus) push('S', sus === 2 ? 2 : 5, sus === 2 ? 1 : 3, 'sus' + sus, 40);
      else push('3', minor ? 3 : 4, 2, '第3音', 40);
    }
    if (!omit5) push('5', fifth, 4, '第5音', fifth === 7 ? 3 : 25);
    if (sixth) push('6', 9, 5, '第6音', 25);
    if (seventh != null) push('7', seventh, 6, '第7音', 30);
    if (9 in tens) push('T', tens[9], 1, tens[9] === 1 ? '♭9' : tens[9] === 3 ? '♯9' : '9', implied9 ? 2 : 12, implied9);
    if (11 in tens) push('T', tens[11], 3, tens[11] === 6 ? '♯11' : '11', 12);
    if (13 in tens) push('T', tens[13], 5, tens[13] === 8 ? '♭13' : '13', 12);

    let bassPc = rootPc, bassIdx = 0;
    if (bass) {
      bassPc = spPc(bass);
      bassIdx = tones.findIndex(function (x) { return x.pc === bassPc; });
      if (bassIdx < 0) { tones.push({ role: 'B', semis: mod(bassPc - rootPc, 12), pc: bassPc, sp: bass, label: 'バス音', need: 40, opt: false }); bassIdx = tones.length - 1; }
    }

    const isDom = !minor && !sus && !omit3 && seventh === 10;
    const symmetric = (dim && seventh === 9) || (fifth === 8 && seventh == null && !minor && !sus && !Object.keys(tens).length);
    const hasB = tones.some(function (x) { return x.role === 'B'; });
    const w = tones.map(function (x) {
      if (symmetric) return 1;
      switch (x.role) {
        case 'R': return hasB ? 3.0 : 4.5;
        case '3': return isDom ? 1.9 : 2.5;
        case 'S': return 2.5;
        case '5': return x.semis === 7 ? 3.0 : 2.2;
        case '6': return 1.8;
        case '7': return 2.0;
        case 'B': return 4.0;
        default: return x.opt ? 0.6 : 1.1;
      }
    });
    if (!symmetric && bassIdx > 0 && tones[bassIdx].role !== 'B') { w[bassIdx] += 1.5; w[0] -= 0.5; }
    const wsum = w.reduce(function (a, b) { return a + b; }, 0);
    tones.forEach(function (x, k) {
      x.target = w[k] / wsum;
      x.over = x.role === '3' ? (isDom ? 3 : 2.2) : x.role === '7' || x.role === '6' ? 2 : x.role === 'T' ? 2.5 : x.role === 'S' ? 1.5 : (x.role === '5' && x.semis !== 7) ? 1.5 : 1;
    });

    const pretty = rest.replace(/(b|-)(?=13|9|5)/g, '♭').replace(/(#|\+)(?=11|9|5)/g, '♯');
    const symbol = LET[root.l] + ACC[root.a] + pretty + (bass ? '/' + LET[bass.l] + ACC[bass.a] : '');
    return {
      symbol: symbol, raw: raw, root: root, rootPc: rootPc, suffix: rest, bass: bass, bassPc: bassPc, bassIdx: bassIdx,
      tones: tones, minor: minor, isDom: isDom, symmetric: symmetric, hasSeventh: seventh != null,
      pcs: tones.map(function (x) { return x.pc; })
    };
  }

  /* "C Am | F G7" → chords; separators: spaces, |, 、, ｜, →, - between spaces */
  function parseProgression(text) {
    const parts = String(text || '').normalize('NFKC').split(/[\s|｜、→>]+/).filter(function (x) { return x && x !== '-' && x !== '–'; });
    const chords = [], errors = [];
    parts.forEach(function (p) { const c = parseChord(p); if (c.error) errors.push(c.error); else chords.push(c); });
    return { chords: chords, errors: errors };
  }

  /* ---------- chord identification from weighted pitch classes ---------- */
  const TEMPLATES = [
    ['', 0], ['m', 0], ['7', 0.03], ['m7', 0.03], ['maj7', 0.03], ['dim', 0.03], ['m7b5', 0.05], ['dim7', 0.05],
    ['aug', 0.06], ['sus4', 0.05], ['sus2', 0.07], ['6', 0.06], ['m6', 0.07], ['mM7', 0.08], ['7sus4', 0.07],
    ['aug7', 0.09], ['9', 0.08], ['maj9', 0.09], ['m9', 0.09], ['add9', 0.08], ['madd9', 0.09], ['7b9', 0.09], ['7#9', 0.1]
  ].map(function (t) { const c = parseChord('C' + t[0]); return { suf: t[0], prior: t[1], tones: c.tones.map(function (x) { return { semis: x.semis, role: x.role, alt5: x.role === '5' && x.semis !== 7 }; }) }; });
  const MISS = { R: 0.35, '3': 0.3, S: 0.3, '7': 0.3, '6': 0.3, T: 0.25 };

  /* w: 12 weights (any scale); bassPc: lowest pitch class or -1; spell: optional map pc → {l,a} */
  function identifyChord(w, bassPc, spell) {
    let total = 0; for (let k = 0; k < 12; k++) total += w[k];
    if (total <= 0) return [];
    const n = w.map(function (x) { return x / total; });
    const present = n.filter(function (x) { return x > 0.04; }).length;
    const out = [];
    if (present <= 1) {
      const pc = n.indexOf(Math.max.apply(null, n));
      const sp = (spell && spell[pc]) || spellPc(pc);
      const c = parseChord(LET[sp.l] + (sp.a > 0 ? '#'.repeat(sp.a) : 'b'.repeat(-sp.a)) + '5');
      c.symbol = LET[sp.l] + ACC[sp.a] + '（単音）'; c.unison = true;
      return [{ chord: c, score: 1, conf: 'high', out: 0 }];
    }
    for (let r = 0; r < 12; r++) {
      for (let ti = 0; ti < TEMPLATES.length; ti++) {
        const T = TEMPLATES[ti];
        let inSum = 0, missing = 0, bassIn = false;
        for (let j = 0; j < T.tones.length; j++) {
          const pc = (r + T.tones[j].semis) % 12;
          inSum += n[pc];
          if (pc === bassPc) bassIn = true;
          const role = T.tones[j].role;
          if (n[pc] < (role === 'T' ? 0.15 : role === '7' || role === '6' ? 0.08 : 0.03)) missing += role === '5' ? (T.tones[j].alt5 ? 0.3 : 0.08) : (MISS[role] || 0.25);
        }
        const outSum = 1 - inSum;
        const sc = inSum - 1.5 * outSum - missing - T.prior + (bassPc === r ? 0.12 : bassIn ? 0.03 : bassPc >= 0 ? -0.1 : 0);
        out.push({ r: r, T: T, score: sc, out: outSum, missing: missing, bassIn: bassIn });
      }
    }
    if (present === 2) {
      // bare fifth / fourth → power chord
      for (let r = 0; r < 12; r++) {
        const inSum = n[r] + n[(r + 7) % 12];
        out.push({ r: r, T: { suf: '5', prior: 0.02, tones: [] }, score: inSum - 1.5 * (1 - inSum) - 0.02 + (bassPc === r ? 0.12 : 0), out: 1 - inSum, missing: 0, bassIn: bassPc === r || bassPc === (r + 7) % 12 });
      }
    }
    out.sort(function (a, b) { return b.score - a.score; });
    const res = [], seen = {};
    for (let k = 0; k < out.length && res.length < 3; k++) {
      const c = out[k];
      const minorish = /^(m(?!aj)|dim)/.test(c.T.suf);
      const sp = (spell && spell[c.r]) || spellPc(c.r, minorish && [1, 6, 8].indexOf(c.r) >= 0 ? 'sharp' : 'flat');
      let sym = LET[sp.l] + (sp.a > 0 ? '#'.repeat(sp.a) : 'b'.repeat(-sp.a)) + c.T.suf;
      if (bassPc >= 0 && bassPc !== c.r && c.bassIn) {
        const bs = (spell && spell[bassPc]) || spellPc(bassPc);
        sym += '/' + LET[bs.l] + (bs.a > 0 ? '#'.repeat(bs.a) : 'b'.repeat(-bs.a));
      }
      if (seen[sym]) continue; seen[sym] = 1;
      const chord = parseChord(sym);
      if (chord.error) continue;
      const margin = res.length === 0 && out[k + 1] ? c.score - out[k + 1].score : 0;
      res.push({ chord: chord, score: c.score, out: c.out, missing: c.missing, margin: margin, bassForeign: bassPc >= 0 && !c.bassIn });
    }
    if (res.length) {

  /* ---------- sound ---------- */
  let AC = null, master = null, hWave = null;
  function audio() {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); master = AC.createGain(); master.gain.value = 0.8; const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
      const h = [1, 0.5, 0.3, 0.16, 0.1, 0.06, 0.04, 0.03], re = new Float32Array(h.length + 1), im = new Float32Array(h.length + 1); h.forEach(function (v, k) { im[k + 1] = v; }); hWave = AC.createPeriodicWave(re, im); }

  }

  /* ---------- ティンパニ ---------- */

    else if (!seq.steps.length) res = '<p class="empty">音を入れると、張り替えの段取りが出ます。</p>';
    else {
      res += '<div class="okline">' + badge(lv, lv === 'ok' ? 'そのまま叩ける' : lv === 'hard' ? '張り替えが忙しい' : '音域の外がある') + '<span>音の張り替えは ' + plan.changes.length + ' 回。</span></div>';
      res += '<h4>叩き始めの音</h4><ul class="chg">' + drums.map(function (d, k) { return '<li><b>' + d.name + '</b><span class="when">' + (plan.init[k] == null ? '使わない' : esc(fP(plan.init[k]))) + '</span></li>'; }).join('') + '</ul><div class="btns"><button type="button" class="btn" data-act="tpuse">この音を太鼓に入れる</button><button type="button" class="btn primary" data-act="tpplay">▶ 通して聴く</button></div>';
      if (plan.changes.length) res += '<h4>張り替え</h4><ul class="chg">' + plan.changes.map(function (c) { return '<li><span class="when">' + esc(seq.steps[c.i].label) + 'の前までに</span><b>' + drums[c.d].name + '　' + esc(fP(c.from)) + ' → ' + esc(fP(c.to)) + '</b>' + badge(c.ok ? 'ok' : 'hard', c.ok ? '間に合う' : '忙しい') + '<small>この太鼓を最後に叩いてから約' + (c.room > 60 ? '60秒以上' : c.room.toFixed(1) + '秒') + '。</small></li>'; }).join('') + '</ul>';
      if (plan.warns.length) res += '<ul class="issues">' + plan.warns.map(function (w) { return '<li class="lv-' + w.lv + '">' + esc(w.text) + '</li>'; }).join('') + '</ul>';
    }
    $('#p-timp').innerHTML = '<div class="lead"><h2>ティンパニ</h2><p>太鼓1台が出せるのは、一度に1つの音。別の音が要るときは、ペダルで張り替えます。その時間が足りるかを見ます。</p></div>' +
      '<div class="cols"><div class="col-in"><section class="card"><h3>太鼓</h3><div class="f"><span>使う太鼓</span><div class="chips">' + O.DRUMS.map(function (d) { return '<button type="button" class="chip" data-act="drumon" data-id="' + d.id + '" aria-pressed="' + (tp.on.indexOf(d.id) >= 0) + '">' + d.id + '″</button>'; }).join('') + '</div></div>' + dsvg +
      '<div class="tune">' + drums.map(function (d) { return '<div class="step"><span class="nm">' + d.id + '″</span><button type="button" data-act="tune" data-id="' + d.id + '" data-d="-1" aria-label="' + d.name + 'を半音下げる"' + (tp.tune[d.id] <= d.lo ? ' disabled' : '') + '>−</button><b>' + esc(fP(tp.tune[d.id])) + '</b><button type="button" data-act="tune" data-id="' + d.id + '" data-d="1" aria-label="' + d.name + 'を半音上げる"' + (tp.tune[d.id] >= d.hi ? ' disabled' : '') + '>＋</button><small>' + esc(fP(d.lo)) + '〜' + esc(fP(d.hi)) + '</small></div>'; }).join('') + '</div><p class="cap">音域は標準的な目安。楽器によって少し違います。</p></section>' +
      '<section class="card"><h3>音を並べて点検</h3>' + seqInput('tp', tp, '空白で区切る。休みは r、小節の区切りは |') + (seq.errors.length ? '<ul class="issues">' + seq.errors.map(function (e) { return '<li class="lv-hard">' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="f"><span>張り替えに欲しい時間</span>' + chips('tp.need', [[2, '2秒'], [3, '3秒'], [5, '5秒']], tp.need, '張り替えの時間', 'num') + '</div></section></div>' +
      '<div class="col-out"><section class="card result">' + res + '</section></div></div>';
  }

  /* ---------- events ---------- */
  const RENDER = { harp: renderHarp, gliss: renderGliss, check: renderCheck, timp: renderTimp };
  function render() { TABS.forEach(function (t) { $('#p-' + t).hidden = t !== S.tab; const b = $('#tab-' + t); b.setAttribute('aria-selected', String(t === S.tab)); b.tabIndex = t === S.tab ? 0 : -1; }); RENDER[S.tab](); }
  function go(tab, push) { if (TABS.indexOf(tab) < 0) return; S.tab = tab; save(); render(); if (push) { try { if (location.hash !== '#' + tab) location.hash = tab; } catch (e) { /* ignore */ } } }
  function copy(text) { const fb = function () { toast('コピーできませんでした：' + text); }; try { navigator.clipboard.writeText(text).then(function () { toast('コピーしました：' + text); }, fb); } catch (e) { fb(); } }
  function addTok(tok) { const ck = S.ck, parts = ck.text.trim().split(/\s+/).filter(Boolean); const last = parts[parts.length - 1]; if (ck.chord && last && /^[A-Ga-g]/.test(last) && /^[A-G]/.test(tok)) parts[parts.length - 1] = last + '+' + tok; else parts.push(tok); ck.text = parts.join(' '); save(); render(); }
  document.addEventListener('change', function (e) {
    const t = e.target; if (!t.dataset || !t.dataset.bind) return;
    if (t.dataset.type === 'key') { if (t.value !== 'x') { S.ped = O.keyPedals(+t.value); save(); render(); } return; }
    setPath(t.dataset.bind, t.dataset.type === 'num' ? Number(t.value) : t.value);
    ['ck', 'tp'].forEach(function (k) { if (!(S[k].bpm >= 30 && S[k].bpm <= 240)) S[k].bpm = 100; });
    save(); render();
  });
  document.addEventListener('toggle', function (e) { const d = e.target; if (d && d.dataset && d.dataset.open) { S.open[d.dataset.open] = d.open; save(); } }, true);
  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act],[data-tab]'); if (!b) return;
    if (b.dataset.tab) { go(b.dataset.tab, true); return; }
    const a = b.dataset.act, ds = b.dataset;
    if (a === 'set') { setPath(ds.bind, ds.type === 'num' ? Number(ds.v) : ds.v); save(); render(); }
    else if (a === 'ped') { S.ped[+ds.l] = +ds.a; save(); render(); const s = O.HARP_STRINGS[21 + ((+ds.l + 7) % 7)]; pluck(O.stringMidi(s, S.ped)); }
    else if (a === 'gliss') glissPlay(S.ped, ds.d === 'up');
    else if (a === 'copy') copy(ds.text);
    else if (a === 'gplay') glissPlay(renderGliss.list[+ds.k].ped, true);
    else if (a === 'guse') { S.ped = renderGliss.list[+ds.k].ped.slice(); go('harp', true); toast('ペダルを入れました。弦をなぞってみてください。'); }
    else if (a === 'ckuse') { S.ped = ckPlan.init.map(function (x) { return x == null ? 0 : x; }); go('harp', true); toast('弾き始めのペダルを入れました。'); }
    else if (a === 'ckplay') { if (!audio()) { toast('この画面では音を出せません。'); return; } const t0 = AC.currentTime + 0.08; ckSeq.steps.forEach(function (st) { st.ps.forEach(function (p, k) { pluck(p, t0 + st.t + k * 0.012, 0.26); }); }); }
    else if (a === 'key') { const nm = fP(+ds.m, 'sharp').replace('♯', '#'); pluck(+ds.m); addTok(nm); }
    else if (a === 'addtok') { const keep = S.ck.chord; S.ck.chord = false; addTok(ds.v); S.ck.chord = keep; render(); }
    else if (a === 'deltok') { const parts = S.ck.text.trim().split(/\s+/).filter(Boolean); const last = parts[parts.length - 1] || ''; if (last.indexOf('+') > 0) parts[parts.length - 1] = last.slice(0, last.lastIndexOf('+')); else parts.pop(); S.ck.text = parts.join(' '); save(); render(); }
    else if (a === 'oct') { S.ck.oct = Math.min(5, Math.max(1, S.ck.oct + (+ds.d))); save(); render(); }
    else if (a === 'chordmode') { S.ck.chord = !S.ck.chord; save(); render(); }
    else if (a === 'drum') drumHit(S.tp.tune[+ds.id]);
    else if (a === 'drumon') { const id = +ds.id, k = S.tp.on.indexOf(id); if (k >= 0) S.tp.on.splice(k, 1); else S.tp.on.push(id); save(); render(); }
    else if (a === 'tune') { const d = O.DRUMS.find(function (x) { return x.id === +ds.id; }); S.tp.tune[d.id] = Math.min(d.hi, Math.max(d.lo, S.tp.tune[d.id] + (+ds.d))); save(); render(); drumHit(S.tp.tune[d.id]); }
    else if (a === 'tpuse') { tpDrums.forEach(function (d, k) { if (tpPlan.init[k] != null) S.tp.tune[d.id] = tpPlan.init[k]; }); save(); render(); toast('叩き始めの音を太鼓に入れました。'); }
    else if (a === 'tpplay') { if (!audio()) { toast('この画面では音を出せません。'); return; } const t0 = AC.currentTime + 0.08; tpPlan.steps.forEach(function (o) { drumHit(o.step.ps[0], t0 + o.step.t); }); }
  });
  /* strings: tap or sweep */
  let sweeping = false, lastGi = -1;
  function strAt(ev) { const svg = $('#harp'); if (!svg) return -1; const r = svg.getBoundingClientRect(), g = harpGeom(), vx = (ev.clientX - r.left) / r.width * g.W; return Math.min(g.z[1], Math.max(g.z[0], Math.round((vx - 12) / g.gap) + g.z[0])); }
  document.addEventListener('pointerdown', function (e) { if (!e.target.closest || !e.target.closest('#harp-pad')) return; e.preventDefault(); sweeping = true; lastGi = strAt(e); pluckString(lastGi, 0); try { e.target.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } });
  document.addEventListener('pointermove', function (e) { if (!sweeping) return; const gi = strAt(e); if (gi < 0 || gi === lastGi) return; const d = gi > lastGi ? 1 : -1; let k = 0; for (let i = lastGi + d; i !== gi + d; i += d) pluckString(i, (k++) * 0.012); lastGi = gi; });
  ['pointerup', 'pointercancel'].forEach(function (n) { document.addEventListener(n, function () { sweeping = false; }); });
  document.addEventListener('keydown', function (e) { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; const b = e.target.closest && e.target.closest('[role="tab"]'); if (!b) return; const k = TABS.indexOf(S.tab), nx = TABS[(k + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length]; go(nx, true); $('#tab-' + nx).focus(); });
  window.addEventListener('hashchange', function () { const h = location.hash.replace('#', ''); if (TABS.indexOf(h) >= 0 && h !== S.tab) go(h, false); });
  load();
  (function () { const h = (location.hash || '').replace('#', ''); if (TABS.indexOf(h) >= 0) S.tab = h; })();
  render();
  O.sim = { S: S, render: render };
})();

</script>
